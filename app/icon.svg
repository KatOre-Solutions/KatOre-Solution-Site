<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Katore Solutions tab icon: the KO mark on the brand graphite.

    The full lockup is <KO/> at 3.8:1. Dropped into a square that leaves the
    letterforms about 4px tall in a 16px tab, so the outer chevrons are omitted
    and the KO/ core is drawn twice the size instead — a favicon has to survive
    16px, and a legible mark beats a faithful but unreadable one. The navbar
    wordmark and the particle field both still carry the full lockup.
  -->
  <rect width="64" height="64" rx="14" fill="#111315"/>
  <g fill="none" stroke="#f7f8fa" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- K -->
    <path d="M15 21v22"/>
    <path d="M26 21 15 32l11 11"/>
    <!-- O -->
    <circle cx="35.5" cy="32" r="7.5"/>
    <!-- Slash -->
    <path d="M45 43 51 21"/>
  </g>
</svg>
