[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20+; pin so builds don't drift with Netlify defaults.
  NODE_VERSION = "22"

# Declared explicitly: the site was created blank and had its repo attached via
# the API, so Netlify's framework auto-detection never ran. Without this the CI
# build publishes the raw .next directory as static files and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# public/_headers ships a site-wide noindex, so every context is non-indexable
# by default and only production opts back in by deleting it before the build.
# Netlify does not support context-specific [[headers]] in this file, which is
# why this is done through the build command instead.
[context.production]
  command = "rm -f public/_headers && npm run build"

  [context.production.environment]
    NEXT_PUBLIC_DEPLOY_ENV = "production"

# Pre-production: the main branch, served at main--<site>.netlify.app.
[context."main".environment]
  NEXT_PUBLIC_DEPLOY_ENV = "preproduction"

[context.branch-deploy.environment]
  NEXT_PUBLIC_DEPLOY_ENV = "branch"

[context.deploy-preview.environment]
  NEXT_PUBLIC_DEPLOY_ENV = "preview"
